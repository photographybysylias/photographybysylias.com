    <title>Photography Portfolio</title>
    <meta name="description" content="A selection of photography by Sylias Shufelt.">
    <meta name="theme-color" content="#f1f2f3">

    <!-- ================================================================
       EDIT YOUR PAGE HERE â€” ALL EVERYDAY SETTINGS ARE IN THIS BLOCK.

       1. Change heading to "Sports", "Events", "Studio Work", or anything.
       2. Change description, photographer, and navigation links as needed.
       3. Paste an image URL or file path into each photo's src: "...".
          Examples: "images/photo-01.jpg" or "https://example.com/photo.jpg"
          Local paths are relative to this HTML file. GitHub names are case-sensitive.
       4. Change visible: true to visible: false to hide a photo completely.
          Hidden photos leave NO empty spaces and their images are not loaded.
       5. caption is optional. alt describes the photo for screen readers.
       6. Reorder photo blocks to change the order; duplicate one to add more.

       Keep commas and quotation marks. Use true / false WITHOUT quotes.
       Blank src values show clickable placeholder boxes for this template.
       Replace them with your photos, or set those boxes to visible: false.

       Save a copy as index.html inside each gallery folder on GitHub.
       No packages, account, build process, or separate stylesheet needed.
       ================================================================ -->
    <script>
        const PAGE = {

            heading: "Events",

        // EDIT PHOTO VALUES HERE. All 15 slots are visible by default.

    <style>
        :root {
            color-scheme: light;
            --ink: #202020;
            --muted: #5b6065;
            --line: #d7dadd;
            --canvas: #f1f2f3;
            --paper: #fff;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--canvas);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-underline-offset: .22em;
        }

        button {
            color: inherit;
            font: inherit;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 3px solid #2457a6;
            outline-offset: 5px;
        }

        .skip-link {
            position: absolute;
            left: 16px;
            top: -100px;
            padding: 8px 16px;
            background: white;
        }

        .skip-link:focus {
            top: 12px;
            z-index: 2;
        }

        .site {
            width: min(1180px, calc(100% - 48px));
            margin: 28px auto 32px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }

        .photographer {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: .025em;
        }

        .navigation {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .navigation a {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            padding: 8px 13px;
            border: 1px solid transparent;
            border-radius: 4px;
            font-size: .875rem;
            text-decoration: none;
        }

        .navigation a:hover {
            background: #e5e7e9;
        }

        .navigation a[aria-current="page"] {
            border-color: #a6abb0;
            background: var(--paper);
        }

        .portfolio {
            background: var(--paper);
            border: 1px solid var(--line);
            padding: 42px;
        }

        .page-heading {
            margin-bottom: 34px;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.25rem, 6vw, 3.4rem);
            font-weight: 400;
            letter-spacing: -.03em;
            line-height: 1.12;
            overflow-wrap: anywhere;
        }

        .description {
            color: var(--muted);
            max-width: 65ch;
            margin: 12px 0 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 26px 20px;
        }

        .photo {
            margin: 0;
            min-width: 0;
        }

        .photo-button {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            cursor: zoom-in;
            background: #f0f1f2;
            position: relative;
            aspect-ratio: 3 / 2;
            overflow: hidden;
        }

        .photo-button img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 300ms cubic-bezier(.2, .75, .25, 1);
        }

        @media (hover: hover) {
            .photo-button:hover img {
                transform: scale(1.035);
            }

            .photo-button:hover .placeholder {
                background: #e7e9eb;
            }
        }

        .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: #60666c;
            background: #f0f1f2;
            border: 1px solid #e1e4e7;
            transition: background 200ms ease;
        }

        .placeholder-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.35rem;
            color: #4d5359;
        }

        .placeholder-note {
            font-size: .8125rem;
        }

        .photo-caption {
            margin-top: 9px;
            color: var(--muted);
            font-size: .875rem;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .empty-state {
            margin: 0;
            padding: 48px 0;
            color: var(--muted);
        }

        .footer {
            margin-top: 20px;
            color: var(--muted);
            font-size: .875rem;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }

        /* The native dialog keeps keyboard focus inside the enlarged photo view. */
        .lightbox {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: none;
            max-height: none;
            margin: 0;
            border: 0;
            padding: max(76px, env(safe-area-inset-top)) 28px max(28px, env(safe-area-inset-bottom));
            background: transparent;
            color: #fff;
            overflow: hidden;
        }

        .lightbox[open] {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox::backdrop {
            background: rgb(12 14 16 / 94%);
            opacity: 0;
            transition: opacity 260ms ease;
        }

        .lightbox.is-open::backdrop {
            opacity: 1;
        }

        .lightbox-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: min(1200px, 100%);
            max-height: 100%;
            margin: 0;
            opacity: 0;
            transform: translateY(14px) scale(.94);
            transition: opacity 260ms ease, transform 300ms cubic-bezier(.2, .75, .25, 1);
        }

        .lightbox.is-open .lightbox-panel {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .lightbox-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 0;
            flex: 1 1 auto;
        }

        .lightbox-image {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: calc(100vh - 180px);
            max-height: calc(100dvh - 180px);
            object-fit: contain;
            box-shadow: 0 12px 60px rgb(0 0 0 / 22%);
        }

        .lightbox-placeholder {
            width: min(100%, 1000px);
            height: min(65vh, 660px);
            height: min(65dvh, 660px);
            min-height: 80px;
            border: 0;
            background: #e9ebed;
        }

        .lightbox-caption {
            flex: 0 1 auto;
            max-height: 64px;
            overflow-y: auto;
            margin: 14px 0 0;
            padding: 0 8px;
            font-size: .9375rem;
            line-height: 1.5;
            text-align: center;
            color: #e3e5e7;
            overflow-wrap: anywhere;
        }

        .lightbox-close {
            position: absolute;
            z-index: 1;
            top: max(18px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
            display: grid;
            place-items: center;
            width: 46px;
            height: 46px;
            padding: 0;
            border: 1px solid #6d7379;
            border-radius: 50%;
            background: #202327;
            color: white;
            cursor: pointer;
            opacity: 0;
            transition: opacity 200ms ease, background 200ms ease;
        }

        .lightbox.is-open .lightbox-close {
            opacity: 1;
        }

        .lightbox-close:hover {
            background: #3a3e43;
        }

        .lightbox-close:focus-visible {
            outline-color: white;
        }

        .lightbox-close svg {
            width: 22px;
            height: 22px;
        }

        @media (max-width: 860px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .navigation {
                margin-left: -13px;
            }

            .portfolio {
                padding: 30px;
            }

            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 24px 16px;
            }
        }

        @media (max-width: 540px) {
            .site {
                width: calc(100% - 24px);
                margin-top: 20px;
            }

            .portfolio {
                padding: 26px 18px;
            }

            .page-heading {
                margin-bottom: 25px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 22px;
            }

            .navigation {
                gap: 0;
            }

            .navigation a {
                padding-left: 10px;
                padding-right: 10px;
            }

            .lightbox {
                padding-left: 12px;
                padding-right: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition: none !important;
                animation: none !important;
            }

            .lightbox-panel {
                transform: none;
            }

            .photo-button:hover img {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <a class="skip-link" href="#gallery">Skip to photographs</a>
    <div class="site">
        <header class="topbar">
            <p class="photographer" id="photographer"></p>
            <nav class="navigation" id="navigation" aria-label="Portfolio pages"></nav>
        </header>
        <main class="portfolio">
            <header class="page-heading">
                <h1 id="heading"></h1>
                <p class="description" id="description"></p>
            </header>
            <div class="gallery" id="gallery" aria-label="Photographs"></div>
            <p class="empty-state" id="empty-state" hidden>No photographs to display yet.</p>
            <noscript>
                <p>Please enable JavaScript to view this photography gallery.</p>
            </noscript>
        </main>
        <footer class="footer" id="footer"></footer>
    </div>

    <dialog class="lightbox" id="lightbox" aria-labelledby="lightbox-title">
        <h2 class="sr-only" id="lightbox-title">Enlarged photograph</h2>
        <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close enlarged photograph" autofocus>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18"></path>
            </svg>
        </button>
        <figure class="lightbox-panel" id="lightbox-panel">
            <div class="lightbox-stage" id="lightbox-stage"></div>
            <figcaption class="lightbox-caption" id="lightbox-caption" hidden></figcaption>
        </figure>
    </dialog>

    <script>
        // GALLERY LOGIC â€” edit PAGE and PHOTOS at the top instead of this section.
        const get = (id) => document.getElementById(id);
        const gallery = get("gallery");
        const lightbox = get("lightbox");
        const panel = get("lightbox-panel");
        const stage = get("lightbox-stage");
        const closeButton = get("lightbox-close");
        const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
        let lightboxState = "closed";
        let closeTimer;
        let returnFocus;
        let savedOverflow = "";
        let savedPadding = "";

        function photoLabel(index) {
            return "Photo " + String(index + 1).padStart(2, "0");
        }

        function makePlaceholder(index, unavailable = false) {
            const box = document.createElement("span");
            box.className = "placeholder";
            const title = document.createElement("span");
            title.className = "placeholder-title";
            title.textContent = photoLabel(index);
            const note = document.createElement("span");
            note.className = "placeholder-note";
            note.textContent = unavailable ? "Image unavailable" : "Image placeholder";
            box.append(title, note);
            return box;
        }

        function renderGallery() {
            gallery.replaceChildren();
            PHOTOS.forEach((photo, index) => {
                if (photo.visible === false) return;
                const figure = document.createElement("figure");
                figure.className = "photo";
                const button = document.createElement("button");
                button.type = "button";
                button.className = "photo-button";
                button.setAttribute("aria-haspopup", "dialog");
                const alt = photo.alt || photo.caption || (PAGE.heading + " photograph " + (index + 1));
                button.setAttribute("aria-label", "Enlarge " + (photo.src ? alt : photoLabel(index) + " placeholder"));
                const source = (photo.src || "").trim();
                if (source) {
                    const img = document.createElement("img");
                    img.alt = alt;
                    img.loading = gallery.children.length < 3 ? "eager" : "lazy";
                    img.decoding = "async";
                    img.style.objectFit = PAGE.thumbnailFit === "contain" ? "contain" : "cover";
                    img.addEventListener("error", () => button.replaceChildren(makePlaceholder(index, true)), {
                        once: true
                    });
                    img.src = source;
                    button.append(img);
                } else {
                    button.append(makePlaceholder(index));
                }
                button.addEventListener("click", () => openLightbox(photo, index, button));
                figure.append(button);
                if (photo.caption) {
                    const caption = document.createElement("figcaption");
                    caption.className = "photo-caption";
                    caption.textContent = photo.caption;
                    figure.append(caption);
                }
                gallery.append(figure);
            });
            get("empty-state").hidden = gallery.children.length > 0;
        }

        function openLightbox(photo, index, opener) {
            if (lightboxState !== "closed") return;
            returnFocus = opener;
            stage.replaceChildren();
            const source = (photo.src || "").trim();
            const alt = photo.alt || photo.caption || (PAGE.heading + " photograph " + (index + 1));
            get("lightbox-title").textContent = source ? alt : photoLabel(index) + " placeholder";
            get("lightbox-caption").textContent = photo.caption || "";
            get("lightbox-caption").hidden = !photo.caption;
            if (source) {
                const img = document.createElement("img");
                img.className = "lightbox-image";
                img.alt = alt;
                img.addEventListener("error", () => {
                    if (!stage.contains(img)) return;
                    const fallback = makePlaceholder(index, true);
                    fallback.classList.add("lightbox-placeholder");
                    stage.replaceChildren(fallback);
                }, {
                    once: true
                });
                img.src = source;
                stage.append(img);
            } else {
                const placeholder = makePlaceholder(index);
                placeholder.classList.add("lightbox-placeholder");
                stage.append(placeholder);
            }
            lightbox.showModal();
            lightboxState = "open";
            savedOverflow = document.body.style.overflow;
            savedPadding = document.body.style.paddingRight;
            const scrollbarWidth = Math.max(0, window.innerWidth - document.documentElement.clientWidth);
            const padding = parseFloat(window.getComputedStyle(document.body).paddingRight) || 0;
            document.body.style.overflow = "hidden";
            if (scrollbarWidth) document.body.style.paddingRight = (padding + scrollbarWidth) + "px";
            closeButton.focus({
                preventScroll: true
            });
            // Let the initial scale and opacity render before the opening transition.
            void panel.offsetWidth;
            requestAnimationFrame(() => {
                if (lightboxState === "open") lightbox.classList.add("is-open");
            });
        }

        function finishClosing() {
            if (lightboxState !== "closing") return;
            clearTimeout(closeTimer);
            lightbox.close();
        }

        function closeLightbox() {
            if (lightboxState !== "open") return;
            lightboxState = "closing";
            lightbox.classList.remove("is-open");
            if (motionPreference.matches) {
                finishClosing();
            } else {
                // Fallback also finishes if a browser skips the transitionend event.
                closeTimer = setTimeout(finishClosing, 340);
            }
        }

        panel.addEventListener("transitionend", (event) => {
            if (event.target === panel && event.propertyName === "transform") finishClosing();
        });
        closeButton.addEventListener("click", closeLightbox);
        lightbox.addEventListener("cancel", (event) => {
            event.preventDefault(); // Escape uses the same smooth closing animation.
            closeLightbox();
        });
        lightbox.addEventListener("click", (event) => {
            if (event.target === lightbox || event.target === stage || event.target === panel) closeLightbox();
        });
        lightbox.addEventListener("close", () => {
            clearTimeout(closeTimer);
            lightboxState = "closed";
            lightbox.classList.remove("is-open");
            document.body.style.overflow = savedOverflow;
            document.body.style.paddingRight = savedPadding;
            stage.replaceChildren();
            if (returnFocus && returnFocus.isConnected) returnFocus.focus({
                preventScroll: true
            });
        });

        document.title = PAGE.heading + " | " + PAGE.photographer;
        document.querySelector('meta[name="description"]').content = (PAGE.description || PAGE.heading + " photography") + " â€” " + PAGE.photographer;
        get("photographer").textContent = PAGE.photographer;
        get("heading").textContent = PAGE.heading;
        get("description").textContent = PAGE.description;
        get("description").hidden = !PAGE.description;
        get("footer").textContent = "© " + new Date().getFullYear() + " " + "Photography By Sylias";
        PAGE.navigation.forEach((item) => {
            const link = document.createElement("a");
            link.href = item.url;
            link.textContent = item.label;
            if (item.label.toLowerCase() === PAGE.heading.toLowerCase()) link.setAttribute("aria-current", "page");
            get("navigation").append(link);
        });
        renderGallery();
    </script>
</body>

</html>
